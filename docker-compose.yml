services:

  db:
    image: postgres:16-alpine

    container_name: resume_optimizer_db

    environment:
      POSTGRES_DB: resume_optimizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d resume_optimizer"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: resume_optimizer_backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - resume_exports:/app/app/exports/resumes

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: resume_optimizer_frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:

  postgres_data:

  resume_exports: